# Kalypzo Atrium – Website (statischer SvelteKit-Build)
# Wird als /etc/nginx/conf.d/default.conf eingebunden (http-Kontext des Images nginx-unprivileged).
# TLS terminiert davor Traefik (Dokploy); dieser Server spricht nur HTTP auf 8080.

# Startseite "/" -> /en, wenn der Browser Englisch bevorzugt, sonst /de.
map $http_accept_language $atrium_lang_home {
	default   /de;
	"~*^en"   /en;
}

# Datensparsame Zugriffsprotokolle (Art. 5 Abs. 1 lit. c DSGVO): IP-Adressen werden vor dem
# Schreiben gekürzt (IPv4: letztes Oktett = 0, IPv6: nur die ersten drei Blöcke).
map $remote_addr $atrium_anon_ip {
	~^(?<ip4>\d+\.\d+\.\d+)\.\d+$             $ip4.0;
	~^(?<ip6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  $ip6::;
	default                                    0.0.0.0;
}
log_format atrium_anon '$atrium_anon_ip [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

server {
	access_log /dev/stdout atrium_anon;

	# Nur IPv4: Docker-Netze haben oft kein IPv6, ein [::]-Listen würde den Start verhindern.
	listen 8080;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	server_tokens off;
	absolute_redirect off;
	port_in_redirect off;
	charset utf-8;
	charset_types text/plain text/css text/xml application/xml application/json application/manifest+json application/javascript text/javascript image/svg+xml;

	# Echte Client-IP hinter Traefik (Docker-/private Netze)
	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	real_ip_header X-Forwarded-For;
	real_ip_recursive on;

	# Vorkomprimierte Dateien (*.gz aus precompress) bevorzugen; gzip als Fallback.
	# Brotli ist im Standard-nginx nicht enthalten, die *.br-Dateien bleiben ungenutzt.
	gzip_static on;
	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_types text/plain text/css text/xml application/xml application/json application/manifest+json application/javascript text/javascript image/svg+xml;

	error_page 404 /404.html;

	# Healthcheck für Docker / Dokploy
	location = /healthz {
		access_log off;
		default_type text/plain;
		add_header Cache-Control "no-store" always;
		return 200 "ok\n";
	}

	# Sprachweiche auf der Startseite
	location = / {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Vary "Accept-Language" always;
		add_header Cache-Control "no-store" always;
		return 302 $atrium_lang_home;
	}

	# Abschließende Schrägstriche per 301 entfernen (/de/docs/ -> /de/docs).
	# Zeichenklasse bewusst eng, damit z. B. "/\evil.com/" keine offene Weiterleitung erzeugt.
	location ~ "^(/[A-Za-z0-9._~-][A-Za-z0-9._~/-]*)/$" {
		include /etc/nginx/snippets/security-headers.conf;
		return 301 $1$is_args$args;
	}

	# Gehashte Build-Artefakte: 1 Jahr, unveränderlich
	location ^~ /_app/immutable/ {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# Screenshots: 30 Tage
	location ^~ /screenshots/ {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "public, max-age=2592000" always;
		try_files $uri =404;
	}

	# Bilder und Schriften: 30 Tage
	location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "public, max-age=2592000" always;
		try_files $uri =404;
	}

	# Web-App-Manifest mit korrektem MIME-Typ
	location ~* \.webmanifest$ {
		types { }
		default_type application/manifest+json;
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "public, max-age=86400" always;
		try_files $uri =404;
	}

	# Sitemap und robots.txt
	location = /sitemap.xml {
		types { }
		default_type application/xml;
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "public, max-age=3600" always;
		try_files $uri =404;
	}

	location = /robots.txt {
		types { }
		default_type text/plain;
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "public, max-age=3600" always;
		try_files $uri =404;
	}

	# Versteckte Dateien nie ausliefern
	location ~ /\. {
		include /etc/nginx/snippets/security-headers.conf;
		return 404;
	}

	# Alles andere: HTML-Seiten (/de -> de.html) und übrige Assets – immer revalidieren
	location / {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-cache" always;
		try_files $uri $uri.html $uri/index.html =404;
	}
}
