# Sicherheits-Header – wird in JEDE location eingebunden, die eigene add_header-Direktiven setzt
# (nginx vererbt add_header nicht in locations, die selbst add_header verwenden).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# SvelteKit-Bootstrap, Theme-Skript in app.html und JSON-LD sind Inline-Skripte -> 'unsafe-inline'.
# Bilder aus den READMEs der Marktplatz-Detailseiten werden direkt von GitHub geladen
# -> raw.githubusercontent.com und user-images.githubusercontent.com in img-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://raw.githubusercontent.com https://user-images.githubusercontent.com; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
